<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@1b8d5d149e9498d3ea95aad1037d1411511d41d3/magic-tiles-3/">
  <title>Magic Tiles 3</title>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js" nonce="4eHT7UXCvu0lKrKpiCZYiQ"></script>
  <meta name="viewport"
    content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />
  <meta name="screen-orientation" content="<%=orientation%>" />
  <meta name="x5-orientation" content="<%=orientation%>">
  <meta name="x5-page-mode" content="app">
  <link rel="stylesheet" type="text/css" href="style-mobile.css" nonce="4eHT7UXCvu0lKrKpiCZYiQ" />
  <link rel="icon" href="favicon.ico" />
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #splash-logo {
      width: 100vmin;
      height: 100vmin;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    #GameCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img id="splash-logo" src="logo_expanded.jpeg" alt="Magic Tiles 3">
  </div>

  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>

  <script src="src/settings.js" charset="utf-8" nonce="4eHT7UXCvu0lKrKpiCZYiQ"></script>
  <%=webDebugger%>

  <script>
    (function () {
      var localBase = window.location.href.split("?")[0].split("#")[0];
      var customizer = document.createElement("script");
      customizer.src = new URL("customizer.js", localBase).href;
      customizer.onload = function () {
        startGame();
      };
      customizer.onerror = function () {
        startGame();
      };
      document.head.appendChild(customizer);

      function startGame() {
        var mainScript = document.createElement("script");
        mainScript.src = new URL("main.js", localBase).href;
        mainScript.onload = function () {
          var debug = window._CCSettings.debug;
          var gameScript = document.createElement("script");
          gameScript.src = debug ? "cocos2d-js.js" : "cocos2d-js-min.js";
          gameScript.async = true;
          gameScript.onload = function () {
            if (typeof CC_PHYSICS_BUILTIN !== "undefined" &&
                (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON)) {
              var physicsScript = document.createElement("script");
              physicsScript.src = debug ? "physics.js" : "physics-min.js";
              physicsScript.async = true;
              physicsScript.onload = function () {
                window.boot();
              };
              physicsScript.onerror = function () {
                window.boot();
              };
              document.body.appendChild(physicsScript);
            } else {
              window.boot();
            }
          };
          gameScript.onerror = function () {
            console.error("Could not load the Cocos engine.");
          };
          document.body.appendChild(gameScript);
        };
        mainScript.onerror = function () {
          console.error("Could not load main.js from this repository.");
        };
        document.body.appendChild(mainScript);
      }
    })();
  </script>
</body>
</html>
